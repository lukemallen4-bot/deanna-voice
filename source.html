<title>Deanna's Voice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one full-screen board. Message strip on top, picture grid fills the rest, quiet footer with a hold-to-open admin gear. */
:root{
  --bg:#eef2f4; --panel:#ffffff; --fg:#14232b; --muted:#5a6b74; --line:#cfd8dd;
  --accent:#0f6e8c; --speak:#1d7a46; --speak-fg:#ffffff; --danger:#b3261e;
  /* Fitzgerald-style AAC word colors */
  --c-people:#fff1a8; --c-action:#cdefc4; --c-desc:#cfe3ff; --c-thing:#ffd9b3;
  --c-social:#ffd0e1; --c-place:#e6d9ff; --c-question:#e9e9e9; --c-folder:#d6eef2;
  --font:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1f; --panel:#18262d; --fg:#eef4f6; --muted:#9db0b8; --line:#2c3e46;
  --accent:#5cc0de; --speak:#2f9e5e; --speak-fg:#ffffff; --danger:#ff8a80;
  --c-people:#5a4f12; --c-action:#24502a; --c-desc:#1f3b62; --c-thing:#5f3a14;
  --c-social:#5c2338; --c-place:#3b2c63; --c-question:#3a3f42; --c-folder:#1d4650;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --panel:#18262d; --fg:#eef4f6; --muted:#9db0b8; --line:#2c3e46;
  --accent:#5cc0de; --speak:#2f9e5e; --speak-fg:#ffffff; --danger:#ff8a80;
  --c-people:#5a4f12; --c-action:#24502a; --c-desc:#1f3b62; --c-thing:#5f3a14;
  --c-social:#5c2338; --c-place:#3b2c63; --c-question:#3a3f42; --c-folder:#1d4650;
  color-scheme:dark;}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;margin:0;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;
  padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* message strip */
.top{display:flex;gap:10px;align-items:stretch;min-height:96px}
.navbtn,.tool{border:2px solid var(--line);background:var(--panel);border-radius:var(--r);min-width:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:1.05rem;cursor:pointer;touch-action:manipulation}
.navbtn .ico,.tool .ico{font-size:2rem;line-height:1}
.strip{flex:1;min-width:0;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:8px;border-radius:var(--r);
  background:var(--panel);border:2px solid var(--line);cursor:pointer;touch-action:manipulation}
.strip:empty::before{content:attr(data-empty);color:var(--muted);font-size:1.1rem;padding-left:8px}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:10px;background:var(--bg);min-width:64px}
.chip img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.chip .em{font-size:34px;line-height:44px}
.chip span{font-weight:700;font-size:.95rem}
.speakbtn{background:var(--speak);color:var(--speak-fg);border-color:var(--speak);min-width:120px;font-size:1.2rem}

/* board */
.boardwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.grid{flex:1;min-height:0;display:grid;gap:10px}
.cell{position:relative;border:3px solid transparent;border-radius:var(--r);background:var(--c-thing);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;overflow:hidden;
  cursor:pointer;touch-action:manipulation;min-width:0;min-height:0;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.cell .pic{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.cell .pic img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.cell .pic .em{font-size:clamp(28px,6vmin,72px);line-height:1}
.cell .lbl{font-weight:700;font-size:clamp(14px,2.4vmin,24px);text-align:center;line-height:1.1;overflow-wrap:anywhere}
.cell.folder{border-top-left-radius:0}
.cell.folder::after{content:"";position:absolute;top:0;left:0;width:38%;height:8px;background:var(--fg);opacity:.35;border-bottom-right-radius:8px}
.cell.pressed{border-color:var(--fg);transform:scale(.97)}
.cell .hold{position:absolute;left:0;bottom:0;height:8px;width:0;background:var(--fg);opacity:.55}
.cell.holding .hold{width:100%;transition:width var(--hold-ms,300ms) linear}
.cell.blank{background:transparent;border:3px dashed var(--line);box-shadow:none;cursor:default}
.cell.add{background:transparent;border:3px dashed var(--accent);color:var(--accent);box-shadow:none}
.c-people{background:var(--c-people)} .c-action{background:var(--c-action)} .c-desc{background:var(--c-desc)}
.c-thing{background:var(--c-thing)} .c-social{background:var(--c-social)} .c-place{background:var(--c-place)}
.c-question{background:var(--c-question)} .c-folder{background:var(--c-folder)}

.foot{display:flex;align-items:center;gap:10px;min-height:44px}
.foot .name{font-weight:700;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{border:2px solid var(--line);background:var(--panel);border-radius:12px;min-width:110px;min-height:56px;font-weight:700;font-size:1.05rem;cursor:pointer}
.gear{position:relative;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--muted);font-size:20px;cursor:pointer;overflow:hidden;touch-action:none}
.gear .ring{position:absolute;inset:0;background:var(--accent);opacity:.35;transform:scaleY(0);transform-origin:bottom}
.gear.holding .ring{transform:scaleY(1);transition:transform 2s linear}
.editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent);color:var(--bg);border-radius:12px;padding:8px 12px;font-weight:700}
.editbar button{background:var(--bg);color:var(--fg);border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.editbar .sp{flex:1}

/* panels */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.panel{background:var(--panel);color:var(--fg);border-radius:18px;padding:20px;width:min(560px,100%);max-height:88vh;overflow:auto;box-sizing:border-box;
  -webkit-user-select:text;user-select:text;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:1.35rem;text-wrap:balance}
.panel p{margin:0;color:var(--muted);line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem;letter-spacing:.02em}
.field input[type=text],.field input[type=number],.field select,.field textarea{font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:140px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:44px;height:44px;border-radius:10px;border:3px solid var(--line);cursor:pointer}
.swatches button[aria-pressed=true]{border-color:var(--fg)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.preview{width:96px;height:96px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);font-size:56px}
.preview img{width:100%;height:100%;object-fit:cover}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{min-height:64px;font-size:1.5rem;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer}
.pindots{display:flex;gap:12px;justify-content:center;font-size:2rem;letter-spacing:.2em;min-height:2.5rem}
.msg{font-weight:700;color:var(--danger);min-height:1.2em}
.note{font-size:.85rem;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.cell.holding .hold,.gear.holding .ring{transition:none}.cell.pressed{transform:none}}
@media (max-width:640px){.top{min-height:76px}.navbtn,.tool{min-width:64px;font-size:.85rem}.speakbtn{min-width:80px}.navbtn .ico,.tool .ico{font-size:1.5rem}}
</style>

<div id="app">
  <div class="top">
    <button class="navbtn" id="homeBtn" aria-label="Home"><span class="ico">⌂</span>Home</button>
    <div class="strip" id="strip" data-empty="Tap pictures to build a sentence" role="button" aria-label="Sentence. Tap to speak."></div>
    <button class="tool" id="backspaceBtn" aria-label="Remove last word"><span class="ico">⌫</span>Undo</button>
    <button class="tool" id="clearBtn" aria-label="Clear sentence"><span class="ico">✕</span>Clear</button>
    <button class="tool speakbtn" id="speakBtn" aria-label="Speak sentence"><span class="ico">🔊</span>Speak</button>
  </div>
  <div id="editbar" class="editbar" hidden>
    <span>Editing: tap a picture to change it</span><span class="sp"></span>
    <button id="settingsBtn">Settings</button>
    <button id="doneBtn">Done editing</button>
  </div>
  <div class="boardwrap">
    <div class="grid" id="grid"></div>
    <div class="foot">
      <button class="pager" id="prevBtn" hidden>◀ Back page</button>
      <span class="name" id="boardName"></span>
      <button class="pager" id="nextBtn" hidden>More ▶</button>
      <button class="gear" id="gear" aria-label="Caregiver settings, hold for 2 seconds"><span class="ring"></span><span style="position:relative">⚙</span></button>
    </div>
  </div>
</div>
<div id="modal" hidden></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json,.txt" hidden>

<script>
(function(){
const KEY='deanna-voice-v1';
const COLORS=[['people','People'],['action','Doing words'],['desc','Describing'],['thing','Things'],['social','Social'],['place','Places'],['question','Questions'],['folder','Folder']];
let uid=Date.now()%100000;
const id=()=>'i'+(uid++).toString(36);
const it=(label,emoji,color,extra)=>Object.assign({id:id(),label,say:'',emoji,img:'',color,link:''},extra||{});
const fold=(label,emoji,link)=>it(label,emoji,'folder',{link});

function starter(){
  return {
    version:1,
    settings:{cols:5,rows:4,mode:'sentence',holdMs:0,repeatMs:800,voiceURI:'',rate:0.9,pitch:1,pin:'1234',theme:''},
    home:'home',
    boards:{
      home:{name:'Home',items:[
        it('I want','🙋','action'),it('I need','❗','action'),it('Yes','👍','social'),it('No','👎','social'),it('Help','🆘','action'),
        it('Bathroom','🚻','place'),it('Drink','🥤','thing'),it('Eat','🍽️','thing'),it('Hurt','🤕','desc'),it('Tired','😴','desc'),
        it('More','➕','desc'),it('Stop','✋','action'),it('All done','✅','social'),it('Please','🙏','social'),it('Thank you','💐','social'),
        fold('Feelings','🙂','feel'),fold('People','👪','people'),fold('Food','🍎','food'),fold('Things to do','📺','do'),it('I love you','❤️','social')]},
      feel:{name:'Feelings',items:[
        it('Happy','😀','desc'),it('Sad','😢','desc'),it('Angry','😠','desc'),it('Scared','😨','desc'),it('Sick','🤢','desc'),
        it('Cold','🥶','desc'),it('Hot','🥵','desc'),it('Bored','😑','desc'),it('Excited','🤩','desc'),it('Uncomfortable','😣','desc'),
        it('Pain','⚡','desc'),it('Good','🙂','desc')]},
      people:{name:'People',items:[
        it('Luke','🧑','people'),it('Mom','👩','people'),it('Dad','👨','people'),it('Caregiver','🧑‍⚕️','people'),it('Nurse','👩‍⚕️','people'),
        it('Doctor','🩺','people'),it('Friend','🧑‍🤝‍🧑','people'),it('Me','🙋','people'),it('You','👉','people')]},
      food:{name:'Food',items:[
        it('Water','💧','thing'),it('Juice','🧃','thing'),it('Coffee','☕','thing'),it('Milk','🥛','thing'),it('Snack','🍪','thing'),
        it('Breakfast','🥣','thing'),it('Lunch','🥪','thing'),it('Dinner','🍲','thing'),it('Hungry','😋','desc'),it('Thirsty','🫗','desc')]},
      do:{name:'Things to do',items:[
        it('Watch TV','📺','action'),it('Music','🎵','action'),it('Go outside','🌳','action'),it('Go for a ride','🚗','action'),it('Bed','🛏️','place'),
        it('Shower','🚿','action'),it('Phone call','📞','action'),it('iPad','📱','thing'),it('Read','📖','action'),it('Rest','🛋️','action')]}
    }
  };
}

let S=load()||starter();
let board=S.home, page=0, stack=[], editing=false, sentence=[];
function load(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toastErr('Could not save. Storage may be full: try smaller photos or remove some.');return false}}
function applyTheme(){if(S.settings.theme)document.documentElement.setAttribute('data-theme',S.settings.theme);else document.documentElement.removeAttribute('data-theme')}

/* speech */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text){
  if(!text||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    const v=voices.find(v=>v.voiceURI===S.settings.voiceURI);if(v){u.voice=v;u.lang=v.lang}
    u.rate=+S.settings.rate||1;u.pitch=+S.settings.pitch||1;speechSynthesis.speak(u)}catch(e){}
}
const words=i=>i.say||i.label;

/* forgiving press handling: hold duration, ignore repeats, one finger at a time, location of first touch wins */
let lockUntil=0, activePointer=null;
function bindPress(el,fn,opts){
  opts=opts||{};
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{
    if(editing&&!opts.always)return;
    if(activePointer!==null)return;
    if(Date.now()<lockUntil)return;
    activePointer=e.pointerId;try{el.setPointerCapture(e.pointerId)}catch(_){}
    el.classList.add('pressed');
    const hold=opts.hold!=null?opts.hold:(+S.settings.holdMs||0);
    const fire=()=>{lockUntil=Date.now()+(+S.settings.repeatMs||0);fn()};
    if(hold<=0){fire();el._t=null}
    else{el.style.setProperty('--hold-ms',hold+'ms');requestAnimationFrame(()=>el.classList.add('holding'));
      el._t=setTimeout(()=>{el._t=null;el.classList.remove('holding');fire()},hold)}
  });
  const end=e=>{if(e.pointerId!==activePointer)return;activePointer=null;
    if(el._t){clearTimeout(el._t);el._t=null}el.classList.remove('holding','pressed')};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!editing){e.preventDefault();fn()}});
}

/* rendering */
const $=s=>document.querySelector(s);
function pic(i,cls){
  if(i.img){const im=document.createElement('img');im.src=i.img;im.alt='';return im}
  const s=document.createElement('span');s.className=cls||'em';s.textContent=i.emoji||'⬜';return s;
}
function render(){
  const b=S.boards[board]||S.boards[S.home];
  const {cols,rows}=S.settings, per=cols*rows;
  const items=b.items.slice();
  if(editing)items.push({add:true});
  const pages=Math.max(1,Math.ceil(items.length/per));
  if(page>=pages)page=pages-1;
  const g=$('#grid');g.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;g.style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;
  g.innerHTML='';
  items.slice(page*per,page*per+per).forEach(i=>{
    const c=document.createElement('div');c.tabIndex=0;c.setAttribute('role','button');
    if(i.add){c.className='cell add';c.innerHTML='<div class="pic"><span class="em">＋</span></div><div class="lbl">Add picture</div>';
      c.onclick=()=>editItem(null);g.appendChild(c);return}
    c.className='cell c-'+(i.color||'thing')+(i.link?' folder':'');c.setAttribute('aria-label',i.label);
    const p=document.createElement('div');p.className='pic';p.appendChild(pic(i));
    const l=document.createElement('div');l.className='lbl';l.textContent=i.label;
    const h=document.createElement('div');h.className='hold';
    c.append(p,l,h);
    bindPress(c,()=>tapItem(i));
    c.addEventListener('click',()=>{if(editing)editItem(i)});
    g.appendChild(c);
  });
  for(let k=g.children.length;k<per;k++){const c=document.createElement('div');c.className='cell blank';g.appendChild(c)}
  $('#prevBtn').hidden=page===0;$('#nextBtn').hidden=page>=pages-1;
  $('#boardName').textContent=b.name+(pages>1?` · page ${page+1} of ${pages}`:'');
  $('#editbar').hidden=!editing;
  renderStrip();
}
function renderStrip(){
  const s=$('#strip');s.innerHTML='';
  sentence.forEach(i=>{const c=document.createElement('div');c.className='chip';c.appendChild(pic(i));const t=document.createElement('span');t.textContent=i.label;c.appendChild(t);s.appendChild(c)});
  s.scrollLeft=s.scrollWidth;
}
function tapItem(i){
  if(i.link&&S.boards[i.link]){stack.push(board);board=i.link;page=0;render();speak(i.label);return}
  if(S.settings.mode==='speak'){speak(words(i));return}
  sentence.push(i);renderStrip();speak(words(i));
}
bindPress($('#homeBtn'),()=>{board=S.home;page=0;stack=[];render()});
bindPress($('#speakBtn'),()=>speak(sentence.map(words).join(' ')));
bindPress($('#strip'),()=>speak(sentence.map(words).join(' ')));
bindPress($('#backspaceBtn'),()=>{sentence.pop();renderStrip()});
bindPress($('#clearBtn'),()=>{sentence=[];renderStrip()});
bindPress($('#prevBtn'),()=>{page--;render()},{always:true});
bindPress($('#nextBtn'),()=>{page++;render()},{always:true});

/* hold-for-2-seconds gear opens PIN pad */
(function(){const g=$('#gear');let t=null;
  g.addEventListener('pointerdown',e=>{e.preventDefault();g.classList.add('holding');t=setTimeout(()=>{t=null;g.classList.remove('holding');editing?openSettings():askPin()},2000)});
  const stop=()=>{if(t){clearTimeout(t);t=null}g.classList.remove('holding')};
  g.addEventListener('pointerup',stop);g.addEventListener('pointerleave',stop);g.addEventListener('pointercancel',stop);
  g.addEventListener('contextmenu',e=>e.preventDefault());
})();
$('#doneBtn').onclick=()=>{editing=false;save();render()};
$('#settingsBtn').onclick=()=>openSettings();

/* modal helpers */
function modal(html){const m=$('#modal');m.hidden=false;m.innerHTML=`<div class="scrim"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`;return m.querySelector('.panel')}
function close(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function toastErr(t){const p=modal(`<h2>Something went wrong</h2><p>${esc(t)}</p><div class="btns"><button class="btn primary" id="ok">OK</button></div>`);p.querySelector('#ok').onclick=close}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function askPin(){
  let v='';
  const p=modal(`<h2>Caregiver PIN</h2><p>Enter the PIN to edit Deanna's pictures and settings.</p>
    <div class="pindots" id="dots"></div><div class="msg" id="pmsg"></div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="x">Cancel</button><button data-n="0">0</button><button data-n="b">⌫</button></div>`);
  const dots=p.querySelector('#dots');
  p.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.n;
    if(n==='x')return close();
    if(n==='b')v=v.slice(0,-1);else v+=n;
    dots.textContent='●'.repeat(v.length);
    if(v.length>=String(S.settings.pin).length){
      if(v===String(S.settings.pin)){close();editing=true;render()}
      else{p.querySelector('#pmsg').textContent='That PIN is not right. Try again.';v='';dots.textContent=''}
    }
  });
}

/* photo resize: keeps storage small */
function readPhoto(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
    const max=320,sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
    c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',0.78))};im.src=fr.result};fr.readAsDataURL(file)})}

function editItem(item){
  const b=S.boards[board];const isNew=!item;
  const d=item?Object.assign({},item):{id:id(),label:'',say:'',emoji:'⭐',img:'',color:'thing',link:''};
  const boardOpts=Object.entries(S.boards).filter(([k])=>k!==board).map(([k,v])=>`<option value="${k}" ${d.link===k?'selected':''}>${esc(v.name)}</option>`).join('');
  const p=modal(`<h2>${isNew?'Add a picture':'Change this picture'}</h2>
    <div class="row" style="align-items:center"><div class="preview" id="pv"></div>
      <div class="btns" style="justify-content:flex-start;flex:1"><button class="btn primary" id="photo">Take or choose photo</button><button class="btn" id="nophoto">Remove photo</button></div></div>
    <div class="row"><div class="field"><label for="f-label">Word on the button</label><input type="text" id="f-label" value="${esc(d.label)}" placeholder="Water"></div>
      <div class="field" style="max-width:120px"><label for="f-emoji">Symbol</label><input type="text" id="f-emoji" value="${esc(d.emoji)}" maxlength="8"></div></div>
    <div class="field"><label for="f-say">What she says (if different)</label><input type="text" id="f-say" value="${esc(d.say)}" placeholder="I would like some water, please"></div>
    <div class="field"><label>Button color</label><div class="swatches" id="sw">${COLORS.map(([k,n])=>`<button class="c-${k}" data-c="${k}" title="${n}" aria-label="${n}" aria-pressed="${d.color===k}"></button>`).join('')}</div></div>
    <div class="field"><label for="f-link">Opens a page of pictures</label><select id="f-link"><option value="">No, it just speaks</option>${boardOpts}<option value="__new">Yes, make a new page</option></select></div>
    ${isNew?'':`<div class="row"><button class="btn" id="mvL">◀ Move earlier</button><button class="btn" id="mvR">Move later ▶</button></div>`}
    <div class="btns">${isNew?'':'<button class="btn danger" id="del">Delete</button>'}<button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveI">Save</button></div>`);
  const pv=p.querySelector('#pv');const drawPv=()=>{pv.innerHTML='';pv.appendChild(pic(d,'x'))};drawPv();
  p.querySelector('#f-emoji').oninput=e=>{d.emoji=e.target.value;if(!d.img)drawPv()};
  p.querySelectorAll('#sw button').forEach(s=>s.onclick=()=>{d.color=s.dataset.c;p.querySelectorAll('#sw button').forEach(x=>x.setAttribute('aria-pressed',x===s))});
  p.querySelector('#photo').onclick=()=>{const fi=$('#fileIn');fi.value='';fi.onchange=async()=>{if(!fi.files[0])return;try{d.img=await readPhoto(fi.files[0]);drawPv()}catch(e){toastErr('That photo could not be opened. Try a JPG or PNG.')}};fi.click()};
  p.querySelector('#nophoto').onclick=()=>{d.img='';drawPv()};
  p.querySelector('#cancel').onclick=close;
  const idx=()=>b.items.findIndex(x=>x.id===d.id);
  if(!isNew){
    p.querySelector('#del').onclick=()=>{const q=modal(`<h2>Delete “${esc(d.label)}”?</h2><p>This removes the picture from the ${esc(b.name)} page.</p><div class="btns"><button class="btn" id="n">Keep it</button><button class="btn danger" id="y">Delete</button></div>`);
      q.querySelector('#n').onclick=()=>editItem(item);q.querySelector('#y').onclick=()=>{b.items.splice(idx(),1);save();close();render()}};
    p.querySelector('#mvL').onclick=()=>{const k=idx();if(k>0){[b.items[k-1],b.items[k]]=[b.items[k],b.items[k-1]];save();render()}};
    p.querySelector('#mvR').onclick=()=>{const k=idx();if(k<b.items.length-1){[b.items[k+1],b.items[k]]=[b.items[k],b.items[k+1]];save();render()}};
  }
  p.querySelector('#saveI').onclick=()=>{
    d.label=p.querySelector('#f-label').value.trim();d.say=p.querySelector('#f-say').value.trim();
    if(!d.label){p.querySelector('#f-label').focus();return}
    let link=p.querySelector('#f-link').value;
    if(link==='__new'){link='b'+id();S.boards[link]={name:d.label,items:[]};d.color='folder'}
    d.link=link;
    if(isNew)b.items.push(d);else Object.assign(b.items[idx()],d);
    if(save()){close();render()}
  };
}

function openSettings(){
  const st=S.settings;loadVoices();
  const vs=voices.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===st.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})${v.localService?' · works offline':''}</option>`).join('');
  const bd=S.boards[board];
  const p=modal(`<h2>Settings</h2>
    <div class="field"><label for="s-name">Name of this page</label><input type="text" id="s-name" value="${esc(bd.name)}"></div>
    <div class="row"><div class="field"><label for="s-cols">Pictures across</label><input type="number" id="s-cols" min="2" max="10" value="${st.cols}"></div>
      <div class="field"><label for="s-rows">Pictures down</label><input type="number" id="s-rows" min="1" max="8" value="${st.rows}"></div></div>
    <p class="note">Measure a button with a ruler after saving. On a 10 inch tablet, 5 across by 4 down gives buttons about 1.5 inches wide.</p>
    <div class="field"><label for="s-mode">When she taps a picture</label><select id="s-mode">
      <option value="sentence" ${st.mode==='sentence'?'selected':''}>Say it and add it to the sentence</option>
      <option value="speak" ${st.mode==='speak'?'selected':''}>Just say it</option></select></div>
    <div class="row"><div class="field"><label for="s-hold">Hold before it counts (seconds)</label><input type="number" id="s-hold" min="0" max="3" step="0.1" value="${(st.holdMs/1000).toFixed(1)}"></div>
      <div class="field"><label for="s-rep">Ignore extra taps for (seconds)</label><input type="number" id="s-rep" min="0" max="5" step="0.1" value="${(st.repeatMs/1000).toFixed(1)}"></div></div>
    <p class="note">0 hold means a picture works the moment she touches it. Raise it if she brushes buttons by accident.</p>
    <div class="field"><label for="s-voice">Voice</label><select id="s-voice"><option value="">Device default</option>${vs}</select></div>
    <div class="row"><div class="field"><label for="s-rate">Speed (0.5 to 1.5)</label><input type="number" id="s-rate" min="0.5" max="1.5" step="0.05" value="${st.rate}"></div>
      <div class="field"><label for="s-pitch">Pitch (0.5 to 1.5)</label><input type="number" id="s-pitch" min="0.5" max="1.5" step="0.05" value="${st.pitch}"></div></div>
    <div class="btns" style="justify-content:flex-start"><button class="btn" id="test">Test the voice</button></div>
    <div class="row"><div class="field"><label for="s-theme">Colors</label><select id="s-theme"><option value="">Match the device</option><option value="light" ${st.theme==='light'?'selected':''}>Light</option><option value="dark" ${st.theme==='dark'?'selected':''}>Dark</option></select></div>
      <div class="field"><label for="s-pin">Caregiver PIN (4 to 6 digits)</label><input type="text" inputmode="numeric" id="s-pin" value="${esc(st.pin)}"></div></div>
    <div class="msg" id="smsg"></div>
    <h2>Backup</h2><p>Copy a backup of every page and photo, then paste it into a note or email to yourself.</p>
    <div class="btns" style="justify-content:flex-start"><button class="btn" id="exp">Copy backup</button><button class="btn" id="imp">Restore from backup file</button><button class="btn danger" id="reset">Start over with sample pages</button></div>
    <textarea id="bk" rows="3" hidden style="font:12px monospace;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--fg)"></textarea>
    <div class="btns"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveS">Save settings</button></div>`);
  const v=k=>p.querySelector(k).value;
  p.querySelector('#cancel').onclick=close;
  p.querySelector('#test').onclick=()=>{const o={...st};st.voiceURI=v('#s-voice');st.rate=+v('#s-rate');st.pitch=+v('#s-pitch');speak('Hi, I am Deanna. I would like a drink, please.');Object.assign(st,o)};
  p.querySelector('#exp').onclick=()=>{const t=JSON.stringify(S);const ta=p.querySelector('#bk');ta.hidden=false;ta.value=t;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{p.querySelector('#smsg').textContent='Backup copied.'}).catch(()=>{ta.select();p.querySelector('#smsg').textContent='Select all the text in the box and copy it.'})};
  p.querySelector('#imp').onclick=()=>{const fi=$('#importIn');fi.value='';fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.boards||!o.settings)throw 0;S=o;save();board=S.home;page=0;close();applyTheme();render()}catch(e){p.querySelector('#smsg').textContent='That file is not a backup from this app.'}};r.readAsText(f)};fi.click()};
  p.querySelector('#reset').onclick=()=>{const q=modal(`<h2>Start over?</h2><p>This replaces every page and photo with the sample pages. Copy a backup first if you want to keep them.</p><div class="btns"><button class="btn" id="n">Go back</button><button class="btn danger" id="y">Start over</button></div>`);
    q.querySelector('#n').onclick=openSettings;q.querySelector('#y').onclick=()=>{const pin=S.settings.pin;S=starter();S.settings.pin=pin;save();board=S.home;page=0;close();render()}};
  p.querySelector('#saveS').onclick=()=>{
    const pin=v('#s-pin').trim();if(!/^\d{4,6}$/.test(pin)){p.querySelector('#smsg').textContent='The PIN must be 4 to 6 digits.';return}
    const cl=(x,a,b)=>Math.min(b,Math.max(a,x));
    bd.name=v('#s-name').trim()||bd.name;
    Object.assign(st,{cols:cl(parseInt(v('#s-cols'))||5,2,10),rows:cl(parseInt(v('#s-rows'))||4,1,8),mode:v('#s-mode'),
      holdMs:Math.round(cl(+v('#s-hold')||0,0,3)*1000),repeatMs:Math.round(cl(+v('#s-rep')||0,0,5)*1000),
      voiceURI:v('#s-voice'),rate:cl(+v('#s-rate')||1,.5,1.5),pitch:cl(+v('#s-pitch')||1,.5,1.5),theme:v('#s-theme'),pin});
    if(save()){applyTheme();close();render()}
  };
}

/* keep screen awake while open, where allowed */
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
wake();applyTheme();render();
})();
</script>
